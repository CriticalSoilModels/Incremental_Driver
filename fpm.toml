[build]
auto-executables = true
auto-tests = true
auto-examples = true
module-naming = false
# external-modules = ["stdlib"]

[dependencies]

# stdlib = { git = "https://github.com/fortran-lang/stdlib", branch = "stdlib-fpm" }
stdlib = {path = "../../stdlib"}
critical-soil-models = {git = "https://github.com/CriticalSoilModels/critical-soil-models"}
# fortplot = { git = "https://github.com/krystophny/fortplot" }

[dev-dependencies]
# fortplot = { git = "https://github.com/krystophny/fortplot/" }
test-drive.git = "https://github.com/fortran-lang/test-drive"


[install]
library = false
test = false
[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

